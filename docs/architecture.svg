<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">filedrop architecture</title>
  <desc id="d">A phone and a computer connect through a signaling server over WebSocket, then exchange files directly over WebRTC. The computer shows a QR code that the phone scans.</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#9cc3ff" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>
    <marker id="arrowEnd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#e8f1ff"/>
    </marker>
    <marker id="arrowStart" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10 0L0 5L10 10z" fill="#e8f1ff"/>
    </marker>
  </defs>

  <rect width="800" height="400" fill="#0b3d91"/>
  <rect width="800" height="400" fill="url(#grid)"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#e8f1ff" stroke-width="1.5"/>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" fill="#e8f1ff" text-anchor="middle">

    <!-- Server -->
    <rect x="300" y="40" width="200" height="80" fill="none" stroke="#e8f1ff" stroke-width="2"/>
    <text x="400" y="74" font-size="16" font-weight="bold">SERVER</text>
    <text x="400" y="96" font-size="12" fill-opacity="0.8">server/ · signaling</text>

    <!-- Phone -->
    <rect x="40" y="200" width="200" height="90" fill="none" stroke="#e8f1ff" stroke-width="2"/>
    <text x="140" y="236" font-size="16" font-weight="bold">PHONE</text>
    <text x="140" y="258" font-size="12" fill-opacity="0.8">client/ · web page</text>

    <!-- Computer -->
    <rect x="560" y="200" width="200" height="90" fill="none" stroke="#e8f1ff" stroke-width="2"/>
    <text x="660" y="236" font-size="16" font-weight="bold">COMPUTER</text>
    <text x="660" y="258" font-size="12" fill-opacity="0.8">extension/ · Chrome</text>

    <!-- Signaling lines -->
    <path d="M140 200V80H300" fill="none" stroke="#e8f1ff" stroke-width="1.5" marker-end="url(#arrowEnd)" marker-start="url(#arrowStart)"/>
    <path d="M660 200V80H500" fill="none" stroke="#e8f1ff" stroke-width="1.5" marker-end="url(#arrowEnd)" marker-start="url(#arrowStart)"/>
    <text x="150" y="70" font-size="11" text-anchor="start" fill-opacity="0.8">WebSocket</text>
    <text x="650" y="70" font-size="11" text-anchor="end" fill-opacity="0.8">WebSocket</text>

    <!-- Direct WebRTC -->
    <path d="M240 245H560" fill="none" stroke="#e8f1ff" stroke-width="3" marker-end="url(#arrowEnd)" marker-start="url(#arrowStart)"/>
    <text x="400" y="232" font-size="12" font-weight="bold">WebRTC · direct</text>
    <text x="400" y="266" font-size="11" fill-opacity="0.8">files</text>

    <!-- QR -->
    <path d="M660 290V330H140V292" fill="none" stroke="#e8f1ff" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowEnd)"/>
    <text x="400" y="322" font-size="11" fill-opacity="0.8">scan QR code · room ID</text>

    <!-- Title block -->
    <rect x="560" y="346" width="200" height="34" fill="none" stroke="#e8f1ff" stroke-width="1.5"/>
    <text x="570" y="360" font-size="11" font-weight="bold" text-anchor="start">FILEDROP · ARCHITECTURE</text>
    <text x="570" y="374" font-size="10" text-anchor="start" fill-opacity="0.8">REV 0.1 · DRAFT</text>
  </g>
</svg>
